<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src __CSP__ 'unsafe-inline'; script-src __CSP__ 'nonce-__NONCE__'; worker-src blob:;"
    />
    <title>Universal Diff Viewer</title>
    <link rel="stylesheet" href="__STYLE__" />
  </head>
  <body>
    <header>
      <strong><span class="logo">UDV</span> Universal Diff Viewer</strong
      ><span id="summary">File changes</span
      ><button id="show-sidebar" title="Show the Universal Diff Viewer file list" aria-label="Show file list">
        Files</button
      ><button id="refresh" title="Refresh Git status and file changes" aria-label="Refresh file changes">↻ Refresh</button
      ><button id="clean-failures" hidden title="Move all failure artifacts to Trash after confirmation">Delete all failures…</button>
    </header>
    <main>
      <section class="review" aria-label="File comparison">
        <div class="detail">
          <div>
            <h1><span id="status-badge" class="badge" hidden></span><span id="filename">Files in focus.</span></h1>
            <p id="context">Choose a changed file in the Universal Diff Viewer sidebar.</p>
          </div>
          <div class="file-actions" aria-label="Current image actions">
            <button id="previous" disabled title="Open the previous changed file (←)" aria-label="Previous changed file">←</button>
            <button id="next" disabled title="Open the next changed file (→)" aria-label="Next changed file">→</button>
            <button id="open" disabled title="Open the current file version in the editor" aria-label="Open file">
              Open file ↗
            </button>
          </div>
        </div>
        <div class="toolbar" id="comparison-toolbar">
          <label
            >View
            <select id="mode">
              <option value="side">Side by side</option>
              <option value="swipe">Swipe</option>
              <option value="overlay">Overlay</option>
              <option value="diff">Pixel diff</option>
              <option value="blink">Blink</option>
              <option value="before">Before</option>
              <option value="after">After</option>
            </select></label
          >
          <label id="mix-control" hidden
            ><span id="mix-label">Position</span
            ><input
              id="mix"
              type="range"
              min="0"
              max="100"
              value="50"
              aria-label="Mix percentage"
            /><output id="mix-value">50%</output></label
          >
          <label id="blink-control" hidden title="Time each version stays visible in Blink view"
            >Interval
            <input
              id="blink-interval"
              type="range"
              min="100"
              max="2000"
              step="50"
              value="650"
              aria-label="Blink interval in milliseconds"
            /><output id="blink-interval-value" for="blink-interval">650 ms</output></label
          >
          <label id="highlight-control"
            ><input id="highlight" type="checkbox" />Highlight changes</label
          >
          <label id="strength-control" hidden
            >Intensity
            <input
              id="strength"
              type="range"
              min="10"
              max="100"
              value="60"
              aria-label="Highlight intensity"
            />
          </label>
          <label
            id="tolerance-control"
            title="Move left to detect every difference. Move right to ignore larger differences in color and transparency. Applies to this comparison; tree percentages always use Exact."
            >Color threshold
            <span class="tolerance-slider">
              <input
                id="tolerance"
                type="range"
                value="0"
                min="0"
                max="255"
                step="1"
                aria-label="Color difference threshold"
              />
              <span class="tolerance-scale" aria-hidden="true"
                ><span>Exact</span><span>Ignore more</span></span
              >
            </span>
            <output id="tolerance-value" for="tolerance" aria-hidden="true"
              >0</output
            >
          </label>
        </div>
        <div class="zoom-toolbar">
          <label
            id="logical-scaling-control"
            title="Display both images at equal width, with original proportions and top alignment. Uncheck to compare their original pixel sizes."
            ><input id="logical-scaling" type="checkbox" />Logical
            scaling</label
          >
          <button id="fit" title="Fit the comparison in the available space">Fit</button><button id="fit-width" title="Fit the comparison to the available width">Width</button
          ><button id="actual" title="Show the comparison at 100% scale">1:1</button
          ><button id="changes" title="Fit the viewport around changed pixels">Fit changes</button>
          <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button
          ><label class="zoom-value"
            ><input
              id="zoom-percent"
              type="number"
              min="1"
              max="1600"
              value="100"
              aria-label="Zoom percent"
            /><output id="zoom">%</output></label
          ><button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
          <label
            >Background
            <select id="background">
              <option value="checker">Checker</option>
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select></label
          >
          <span class="hint"
            >Drag to pan · Ctrl/⌘ + scroll · Double-click for 100%</span
          >
        </div>
        <div id="notice" role="status" hidden></div>
        <div id="viewer">
          <div id="empty">
            <span class="empty-icon">◫</span><strong>No file selected</strong>
            <p>Images, CSV, XLSX, TXT, XML and supported documents</p>
          </div>
          <div id="panes" hidden>
            <section class="pane" id="left-pane">
              <div class="pane-heading">
                <span id="left-label">Before</span><span id="left-size"></span>
              </div>
              <div class="viewport" id="left-viewport">
                <div class="surface"><canvas id="left-canvas"></canvas></div>
              </div>
            </section>
            <section class="pane" id="right-pane">
              <div class="pane-heading">
                <span class="pane-title"><span id="right-label">After</span
                  ><span id="new-badge" title="New image" hidden>new</span></span
                ><span id="right-size"></span>
              </div>
              <div class="viewport" id="right-viewport">
                <div class="surface"><canvas id="right-canvas"></canvas></div>
              </div>
            </section>
          </div>
        </div>
        <footer>
          <span id="metrics" role="status"
            >Select a changed image to begin.</span
          ><span id="position"></span>
        </footer>
      </section>
    </main>
    <script type="module" nonce="__NONCE__" src="__SCRIPT__"></script>
  </body>
</html>
